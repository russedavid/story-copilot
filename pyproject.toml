[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "story-copilot"
version = "0.1.0"
description = "A private storytelling copilot with conversation-driven state and deliberate evidence retrieval."
authors = [{name = "David Russell", email = "10607194+russedavid@users.noreply.github.com"}]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["python-fasthtml==0.14.13", "uvicorn==0.53.0", "httpx==0.28.1", "pydantic==2.13.5", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "numpy", "scipy"]
context = ["transformers==5.16.1", "jinja2==3.1.6"]
mac-audio = ["numpy", "scipy", "sounddevice", "pyobjc-framework-CoreAudio; sys_platform == 'darwin'"]
asr = ["whisperx==3.8.6", "pyannote.audio==4.0.7"]

[project.scripts]
story-copilot = "story_copilot.cli:main"

[tool.setuptools.packages.find]
include = ["story_copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
